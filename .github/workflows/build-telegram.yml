              override func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let cell = tableView.dequeueReusableCell(withIdentifier: "headerSetting", for: indexPath)
                  let toggle = UISwitch()
                  toggle.tag = indexPath.row
                  toggle.addTarget(self, action: #selector(self.valueChanged(_:)), for: .valueChanged)
                  if indexPath.row == 0 {
                      cell.textLabel?.text = "Верификация Major"
                      toggle.isOn = UserDefaults.standard.bool(forKey: majorKey)
                  } else {
                      cell.textLabel?.text = "Статус online"
