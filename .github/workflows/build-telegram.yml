          assert history.count(old_thread) == 1, 'не найден расчёт прочтения для thread messages'
          history = history.replace(old_thread, new_thread, 1)
          old_state = "                        } else if let readState = states[entry.message.id.peerId] {"
          new_state = "\n".join([
              "                        } else if entry.message.id.namespace == 1 {",
              "                            read = true",
              "                        } else if let readState = states[entry.message.id.peerId] {"
          ])
          assert history.count(old_state) == 1, 'не найден расчёт прочтения для обычных сообщений'
          history = history.replace(old_state, new_state, 1)
          fallback = "                        entries.append(MessageHistoryEntry(message: entry.message, isRead: false, location: entry.location, monthLocation: entry.monthLocation, attributes: entry.attributes))"
          fallback_new = "\n".join([
              "                        let isLocalOutgoingRead = entry.message.id.namespace == 1 && !entry.message.flags.contains(.Incoming)",
              "                        entries.append(MessageHistoryEntry(message: entry.message, isRead: isLocalOutgoingRead, location: entry.location, monthLocation: entry.monthLocation, attributes: entry.attributes))"
          ])
          assert history.count(fallback) >= 1, 'не найден fallback расчёта прочтения'
          marker = '            } else {\n                for entry in state.entries {'
          marker_index = history.find(marker, history.find('} else if let transientReadStates = mutableView.transientReadStates'))
          assert marker_index >= 0, 'не найден fallback-блок MessageHistoryView'
          fallback_index = history.find(fallback, marker_index)
          assert fallback_index >= 0, 'не найдена строка fallback'
          history = history[:fallback_index] + history[fallback_index:].replace(fallback, fallback_new, 1)
          open(history_path, 'w', encoding='utf-8').write(history)
          print('Фото добавляются как TelegramMediaImage; локальные исходящие сценарии помечаются прочитанными.')
          build = 'submodules/TelegramUI/BUILD'
          build_source = open(build, encoding='utf-8').read()
          assert '"-warnings-as-errors",' in build_source, 'не найдена настройка warnings-as-errors'
          open(build, 'w', encoding='utf-8').write(build_source.replace('"-warnings-as-errors",', ''))
          assert 'GlassgramScenarioPlaybackController(scenario: scenario)' not in panel
          assert 'onPlay(scenario)' in panel
          assert 'transaction.addMessages([storeMessage], location: .Random)' in methods
          print('Сценарии подключены к настоящему чату; локальные сообщения не отправляются. /nft сохранён.')
          print('Управление: касание двумя пальцами — пауза/продолжить; удержание двумя пальцами — стоп/открыть редактор.')
          PY

      - name: Кэш сборки (восстановить)
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ github.run_id }}
          restore-keys: |
            bazel-

      - name: Собрать IPA
        working-directory: telegram
        run: |
          set -eo pipefail
          mkdir -p build/artifacts
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py $OVERRIDE \
            --bazelUserRoot="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/glassgram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=$((100000 + ${{ github.run_number }})) \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath=build/artifacts 2>&1 | tee build.log
          ls -la build/artifacts

      - name: Кэш сборки (сохранить даже после ошибки)
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ github.run_id }}

      - name: Версия без расширений (для бесплатного Apple ID)
        working-directory: telegram
        run: |
          set -e
          mkdir ipa && cd ipa
          unzip -q ../build/artifacts/Telegram.ipa
          APP=$(ls -d Payload/*.app)
          ls "$APP"
          ls "$APP/PlugIns" 2>/dev/null || true
          rm -rf "$APP/PlugIns" "$APP/Watch"
          zip -qr ../build/artifacts/Telegram-noext.ipa Payload
          ls -la ../build/artifacts

      - name: Сохранить IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: |
            telegram/build/artifacts/Telegram.ipa
            telegram/build/artifacts/Telegram-noext.ipa
          retention-days: 14

      - name: Сохранить лог при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: telegram/build.log
          retention-days: 7
